<!DOCTYPE html>
<html>

<body style="font-family:Arial; background:#f7f7f7; padding:20px;">
    <div style="max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px;">
        <h2 style="color:#4CAF50;">🎉 Booking Confirmed!</h2>

        <p>Hello <strong>{{name}}</strong>,</p>

        <p>You have successfully booked your seat for:</p>

        <div style="background:#f2f2f2; padding:12px; border-left:4px solid #4CAF50;">
            <p><strong>{{eventTitle}}</strong></p>
            <p>Date: {{eventDate}}</p>
            <p>Time: {{eventTime}}</p>
            <p>Location: {{eventLocation}}</p>
        </div>

        <p style="margin-top:20px;">We are excited to see you there! 😊</p>

        <p>Regards,<br>Student Event Management System</p>
    </div>
</body>

</html>
