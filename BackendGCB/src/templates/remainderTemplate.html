<!DOCTYPE html>
<html>

<body style="font-family:Arial; background:#fafafa; padding:20px;">
    <div style="max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px;">
        <h2 style="color:#ff9800;">⏰ Event Reminder</h2>

        <p>Hello {{name}},</p>
        <p>Your event is happening tomorrow!</p>

        <div style="background:#fff3cd; padding:12px; border-left:4px solid #ff9800;">
            <p><strong>{{eventTitle}}</strong></p>
            <p>Date: {{eventDate}}</p>
            <p>Time: {{eventTime}}</p>
            <p>Location: {{eventLocation}}</p>
        </div>

        <p>Please be on time.</p>

        <p>Best Regards,<br>SEMS Team</p>
    </div>
</body>

</html>
